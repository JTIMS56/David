version: "3.9"

services:
  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-david_fx}
      POSTGRES_USER:     ${POSTGRES_USER:-david}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-david} -d ${POSTGRES_DB:-david_fx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── David trading platform ────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database (override SQLite with Postgres)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-david}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-david_fx}
      # Copy all other vars from .env
      ANTHROPIC_API_KEY:     ${ANTHROPIC_API_KEY}
      API_KEY:               ${API_KEY:?API_KEY must be set in production}
      WS_TOKEN:              ${WS_TOKEN:?WS_TOKEN must be set in production}
      ALLOWED_ORIGINS:       ${ALLOWED_ORIGINS:-*}
      ENVIRONMENT:           ${ENVIRONMENT:-production}
      TRADING_MODE:          ${TRADING_MODE:-paper}
      INITIAL_BALANCE:       ${INITIAL_BALANCE:-100000}
      MARKET_DATA_MODE:      ${MARKET_DATA_MODE:-simulation}
      ALPHA_VANTAGE_KEY:     ${ALPHA_VANTAGE_KEY:-}
      AGENT_MODEL:           ${AGENT_MODEL:-claude-sonnet-4-6}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-300}
      MAX_DRAWDOWN_PCT:      ${MAX_DRAWDOWN_PCT:-10.0}
    volumes:
      - app_logs:/app/logs
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx reverse proxy + HTTPS ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # cert + key mounted here
      - certbot_www:/var/www/certbot:ro         # for Let's Encrypt challenges
    networks:
      - external
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt — runs once then exits) ────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run manually: docker compose run certbot certonly --webroot ...
    # Then restart nginx to pick up new certs
    profiles: ["certbot"]   # only runs when explicitly called

volumes:
  postgres_data:
  app_logs:
  certbot_www:

networks:
  internal:
    driver: bridge
    internal: true      # db not reachable from outside
  external:
    driver: bridge
